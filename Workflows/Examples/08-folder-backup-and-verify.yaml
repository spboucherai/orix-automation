# ORIX OS Automation
# File: Workflows/Examples/08-folder-backup-and-verify.yaml
# Description: Built-in automation: archives a folder into a dated zip, restores it into a temporary folder and compares it with the source.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - This is a local copy, not an off-site backup: it protects against mistakes, not against losing the disk.
# - Verification restores the archive into a temporary folder under the backup root and compares it with the source
#   (hidden files included); it needs free space for archive + restored copy. The temporary folder is moved to the
#   Trash afterwards, not erased: empty the Trash to get the space back.
# - One archive per day: a second run on the same day replaces that day's archive (the replaced file is first copied
#   to the run's artifacts).
# - Files that change during the run can make the comparison fail; that is reported as a failed verification, not hidden.
# - Symbolic links are archived as links; a comparison of more than 500 differences is truncated in the output.
# - Old backups are never pruned.
# - Nothing runs while the Mac is off or asleep at 02:00; see the scheduler's missed-run policy.
# - The notification needs the ORIX app (a command-line run has no application bundle): there the last step fails by
#   itself and the run ends PARTIALLY_SUCCEEDED with the backup made and verified.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: folder-backup-and-verify
  name: Folder backup and verification
  description: >-
    Archives a folder into a dated zip, records its SHA-256, restores the archive into a temporary folder,
    compares the restored tree with the source and only then reports the backup as good.
  tags: [backup, archive, verify, schedule]
spec:
  triggers:
    - type: schedule
      cron: "0 2 * * *"
      timezone: America/Toronto
    - type: manual
  parameters:
    - name: source
      type: path
      default: ~/ORIX Samples/folder-backup-and-verify/Documents
      description: Folder to back up.
    - name: backupRoot
      type: path
      default: ~/ORIX Samples/folder-backup-and-verify/Backups
      description: Folder that receives the dated archives.
  permissions:
    filesystem:
      read: ["${{ params.source }}", "${{ params.backupRoot }}"]
      write: ["${{ params.backupRoot }}"]
      delete: ["${{ params.backupRoot }}"]
    notifications: true
  budget:
    maxDurationSeconds: 3600
    maxToolCalls: 20
  steps:
    - id: paths
      set:
        archive: ${{ params.backupRoot }}/backup-${{ env.DATE }}.zip
        restored: ${{ params.backupRoot }}/.verify-${{ env.TIMESTAMP }}
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.backupRoot }}
    - id: archive
      name: Create the archive
      needs: [paths, prepare]
      tool: filesystem.archive
      with:
        source: ${{ params.source }}
        destination: ${{ vars.archive }}
        keepParent: true
        overwrite: true
      timeoutSeconds: 1800
    - id: checksum
      needs: [archive]
      tool: filesystem.checksum
      with:
        path: ${{ vars.archive }}
    - id: record
      name: Record the checksum
      needs: [checksum]
      tool: filesystem.write
      with:
        path: ${{ vars.archive }}.sha256
        content: "${{ steps.checksum.output.digest }}  ${{ basename(vars.archive) }}\n"
        overwrite: true
    - id: restore
      name: Restore into a temporary folder
      needs: [archive]
      tool: filesystem.unarchive
      with:
        source: ${{ vars.archive }}
        destination: ${{ vars.restored }}
      timeoutSeconds: 1800
    - id: compare
      name: Compare the restored copy with the source
      needs: [restore]
      tool: filesystem.compare
      with:
        source: ${{ params.source }}
        destination: ${{ joinPath(vars.restored, basename(params.source)) }}
        includeHidden: true
    - id: cleanup
      name: Move the temporary copy to the Trash
      needs: [compare]
      tool: filesystem.trash
      with:
        path: ${{ vars.restored }}
    - id: check
      needs: [compare, record, cleanup]
      verify:
        - fileNonEmpty: ${{ vars.archive }}
        - fileContains: ${{ vars.archive }}.sha256
          text: ${{ steps.checksum.output.digest }}
        - equals: ["${{ steps.compare.output.kind }}", directories]
        - truthy: ${{ steps.compare.output.identical }}
    - id: result
      needs: [check]
      output:
        archive: ${{ vars.archive }}
        sha256: ${{ steps.checksum.output.digest }}
        bytes: ${{ steps.checksum.output.bytes }}
        entries: ${{ steps.restore.output.count }}
        identical: ${{ steps.compare.output.identical }}
      artifacts:
        - ${{ vars.archive }}
        - ${{ vars.archive }}.sha256
    - id: announce
      needs: [result]
      notify: Backup verified, SHA-256 ${{ slice(steps.checksum.output.digest, 0, 12) }}…
      title: Folder backup
      continueOnError: true
