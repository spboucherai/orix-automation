# ORIX OS Automation
# File: Workflows/Examples/06-batch-image-conversion.yaml
# Description: Built-in automation: converts every image of a folder to one format with sequential names, originals untouched.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Originals are never modified or removed; converted copies go to the output folder.
# - Names are <prefix>-<n>.<format> in listing order (alphabetical); numbers are not zero-padded (the expression
#   language has no padding function).
# - Existing files in the output folder are not overwritten: rerunning into a non-empty folder fails on the first collision.
# - `format` is one of png, jpeg, jpg, heic, tiff, gif, bmp (documents.imageConvert, ImageIO); another value fails the
#   first conversion. Animated GIFs lose their animation (first frame only); HEIC needs OS support.
# - Only the top level of the source folder is read, at most 500 entries.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: batch-image-conversion
  name: Batch image conversion and naming
  description: >-
    Converts every image of a folder to a chosen format and writes the copies to an output folder with
    sequential names, four at a time, then checks that one converted file exists per source image.
  tags: [images, convert, batch]
spec:
  triggers:
    - type: manual
  parameters:
    - name: sourceFolder
      type: path
      default: ~/ORIX Samples/batch-image-conversion/Originals
      description: Folder with the images to convert.
    - name: outputFolder
      type: path
      default: ~/ORIX Samples/batch-image-conversion/Converted
      description: Folder that receives the converted copies.
    - name: format
      type: string
      default: jpeg
      description: Target format (png, jpeg, jpg, heic, tiff, gif or bmp); also used as the file extension.
    - name: prefix
      type: string
      default: image
      description: Prefix of the new file names.
  permissions:
    filesystem:
      read: ["${{ params.sourceFolder }}", "${{ params.outputFolder }}"]
      write: ["${{ params.outputFolder }}"]
  budget:
    maxDurationSeconds: 900
    maxToolCalls: 2000
  variables:
    extensions: [.png, .jpg, .jpeg, .heic, .tiff, .tif, .gif, .bmp]
  steps:
    - id: list
      tool: filesystem.list
      with:
        path: ${{ params.sourceFolder }}
        recursive: false
    - id: images
      needs: [list]
      transform: ${{ filter(steps.list.output.entries, e => e.type == "file" && contains(vars.extensions, lower(extname(e.name)))) }}
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.outputFolder }}
    - id: convert
      name: Convert each image
      needs: [images, prepare]
      foreach: ${{ steps.images.output }}
      as: image
      concurrency: 4
      collect: one
      steps:
        - id: one
          tool: documents.imageConvert
          with:
            source: ${{ image.path }}
            destination: ${{ params.outputFolder }}/${{ params.prefix }}-${{ index + 1 }}.${{ params.format }}
            format: ${{ params.format }}
            quality: 0.85
            overwrite: false
    - id: converted
      needs: [convert]
      tool: filesystem.list
      with:
        path: ${{ params.outputFolder }}
        recursive: false
    - id: check
      needs: [converted]
      verify:
        - truthy: ${{ len(steps.images.output) > 0 }}
        - equals: ["${{ steps.convert.output.count }}", "${{ len(steps.images.output) }}"]
        - equals: ["${{ sum(steps.convert.output.results, r => r.count) }}", "${{ len(steps.images.output) }}"]
        - truthy: ${{ count(steps.converted.output.entries, e => startsWith(e.name, params.prefix + "-") && endsWith(e.name, "." + params.format)) >= len(steps.images.output) }}
        - dirNonEmpty: ${{ params.outputFolder }}
    - id: result
      needs: [check]
      output:
        converted: ${{ steps.convert.output.count }}
        files: ${{ map(steps.convert.output.results, r => r.converted[0].destination) }}
        folder: ${{ params.outputFolder }}
