# ORIX OS Automation
# File: Workflows/Examples/15-browser-data-entry.yaml
# Description: Built-in automation: fills a two-page test form in the built-in browser, asks before submitting, and keeps a screenshot as evidence.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Targets a TEST site: by default http://localhost:8765/form.html, which the user serves from the sample folder
#   (`python3 -m http.server 8765 --bind 127.0.0.1` inside it). Only the host named by the `host` parameter can be
#   opened: it is the declared browser permission, and navigation to any other host is blocked by the browser itself.
# - Plain http is accepted for this Mac's loopback addresses only; any other site must be https.
# - The selectors (#name, #email, #next, #plan, #terms, #submit, #result) match the sample pages; another site needs
#   other selectors. One browser session per run: the steps act on the page that is open.
# - Submitting a form is an external action: the workflow always stops for approval first. An unanswered approval leaves
#   the run WAITING_APPROVAL and nothing is submitted (the browser session is closed when the run ends).
# - Do not point this at a real site without reading its terms; no CAPTCHA, login or anti-bot measure is handled or bypassed.
# - The built-in browser is a private WebKit view: it shares no cookies, history or passwords with Safari.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: browser-data-entry
  name: Multi-step browser data entry on a test site
  description: >-
    Opens a local test form in the built-in browser, fills two pages of fields, asks for approval, submits,
    reads the confirmation, checks that it shows the submitted values and saves a screenshot as evidence.
  tags: [browser, forms, approval, test]
spec:
  triggers:
    - type: manual
  parameters:
    - name: host
      type: string
      default: localhost
      description: The only host the browser may open; it is the declared browser permission.
    - name: pageURL
      type: string
      default: http://${{ params.host }}:8765/form.html
      description: Address of the first page of the test form, on that host.
    - name: fullName
      type: string
      default: Ada Lovelace
      description: Value typed into the name field.
    - name: email
      type: string
      default: ada@example.com
      description: Value typed into the e-mail field.
    - name: plan
      type: string
      default: team
      description: Value chosen in the plan list on the second page (solo, team or company).
    - name: evidenceFolder
      type: path
      default: ~/ORIX Samples/browser-data-entry/Evidence
      description: Folder that receives the confirmation screenshot.
  permissions:
    filesystem:
      read: ["${{ params.evidenceFolder }}"]
      write: ["${{ params.evidenceFolder }}"]
    browser: ["${{ params.host }}"]
  budget:
    maxDurationSeconds: 600
    maxToolCalls: 30
  steps:
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.evidenceFolder }}
    - id: open
      name: Open the form
      tool: browser.open
      with:
        url: ${{ params.pageURL }}
        timeoutSeconds: 30
    - id: formReady
      needs: [open]
      tool: browser.waitFor
      with:
        selector: "#name"
        state: visible
        timeoutSeconds: 15
    - id: fillName
      needs: [formReady]
      tool: browser.fill
      with:
        selector: "#name"
        value: ${{ params.fullName }}
    - id: fillEmail
      needs: [fillName]
      tool: browser.fill
      with:
        selector: "#email"
        value: ${{ params.email }}
    - id: next
      name: Go to the second page
      needs: [fillEmail]
      tool: browser.click
      with:
        selector: "#next"
    - id: detailsReady
      needs: [next]
      tool: browser.waitFor
      with:
        selector: "#plan"
        state: visible
        timeoutSeconds: 15
    - id: choosePlan
      needs: [detailsReady]
      tool: browser.fill
      with:
        selector: "#plan"
        value: ${{ params.plan }}
    - id: acceptTerms
      needs: [choosePlan]
      tool: browser.fill
      with:
        selector: "#terms"
        checked: true
    - id: confirm
      needs: [acceptTerms]
      approval: Submit the form at ${{ params.pageURL }} with name "${{ params.fullName }}", e-mail "${{ params.email }}" and plan "${{ params.plan }}"?
    - id: submit
      needs: [confirm]
      tool: browser.click
      with:
        selector: "#submit"
    - id: confirmation
      needs: [submit]
      tool: browser.waitFor
      with:
        selector: "#result"
        state: visible
        text: ${{ params.fullName }}
        timeoutSeconds: 15
    - id: readResult
      needs: [confirmation]
      tool: browser.read
      with:
        maxBytes: 20000
    - id: screenshot
      needs: [readResult, prepare]
      tool: browser.screenshot
      with:
        path: ${{ params.evidenceFolder }}/confirmation.png
        overwrite: true
    - id: close
      needs: [screenshot]
      tool: browser.close
    - id: check
      needs: [close]
      verify:
        - truthy: ${{ contains(steps.readResult.output.text, params.fullName) }}
        - truthy: ${{ contains(steps.readResult.output.text, params.email) }}
        - truthy: ${{ contains(steps.readResult.output.text, params.plan) }}
        - fileNonEmpty: ${{ params.evidenceFolder }}/confirmation.png
    - id: result
      needs: [check]
      output:
        confirmation: ${{ steps.readResult.output.text }}
        page: ${{ steps.readResult.output.url }}
        screenshot: ${{ params.evidenceFolder }}/confirmation.png
        screenshotSha256: ${{ steps.screenshot.output.sha256 }}
      artifacts:
        - ${{ params.evidenceFolder }}/confirmation.png
