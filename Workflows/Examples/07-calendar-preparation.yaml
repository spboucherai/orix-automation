# ORIX OS Automation
# File: Workflows/Examples/07-calendar-preparation.yaml
# Description: Built-in automation: reads the coming events from Calendar through AppleScript and writes a preparation briefing.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Reads Calendar through Apple Events: macOS asks once for Automation consent (ORIX → Calendar). ORIX never answers
#   that prompt itself; without consent the step ends BLOCKED_PERMISSION.
# - Read-only: no event is created, changed or deleted.
# - Only start date and title are read (one line per event). Recurring events and time zones follow what Calendar reports.
# - Large calendars make the AppleScript query slow; the step has a 120 s timeout.
# - `daysAhead` is interpolated into the script text; it is declared as an integer parameter for that reason.
# - The output field (`result`) is to be reconciled with the real applescript.run tool.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: calendar-preparation
  name: Calendar-based preparation
  description: >-
    Each weekday morning, reads the events of the coming days from the Calendar app (with the user's
    Automation consent) and writes a dated briefing with one preparation checklist line per event.
  tags: [calendar, applescript, briefing, schedule]
spec:
  triggers:
    - type: schedule
      cron: "30 7 * * MON-FRI"
      timezone: America/Toronto
    - type: manual
  parameters:
    - name: daysAhead
      type: integer
      default: 1
      description: Number of days to look ahead, starting today at midnight.
    - name: outputFolder
      type: path
      default: ~/ORIX Samples/calendar-preparation/Briefings
      description: Folder that receives the briefing.
  permissions:
    filesystem:
      write: ["${{ params.outputFolder }}"]
    scripts: [applescript]
    apps:
      automation: [com.apple.iCal]
    notifications: true
  budget:
    maxDurationSeconds: 300
    maxToolCalls: 10
  steps:
    - id: paths
      set:
        briefing: ${{ params.outputFolder }}/briefing-${{ env.DATE }}.md
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.outputFolder }}
    - id: events
      name: Read the coming events
      tool: applescript.run
      with:
        bundleID: com.apple.iCal
        timeoutSeconds: 120
        script: |
          set startDate to current date
          set time of startDate to 0
          set endDate to startDate + (${{ params.daysAhead }} * days)
          set out to ""
          tell application "Calendar"
            repeat with c in calendars
              repeat with e in (every event of c whose start date >= startDate and start date < endDate)
                set out to out & ((start date of e) as string) & tab & (summary of e) & linefeed
              end repeat
            end repeat
          end tell
          return out
      timeoutSeconds: 150
    - id: lines
      needs: [events]
      transform: ${{ filter(split(default(steps.events.output.result, ""), "\n"), l => len(trim(l)) > 0) }}
    - id: write
      name: Write the briefing
      needs: [paths, prepare, lines]
      tool: filesystem.write
      with:
        path: ${{ vars.briefing }}
        overwrite: true
        content: |
          # Briefing for ${{ env.DATE }}

          Events in the next ${{ params.daysAhead }} day(s): ${{ len(steps.lines.output) }}

          ${{ join(map(steps.lines.output, l => "- [ ] " + replace(l, "\t", " — ")), "\n") }}
    - id: check
      needs: [write]
      verify:
        - fileContains: ${{ vars.briefing }}
          text: "# Briefing for"
    - id: announce
      needs: [check]
      notify: ${{ len(steps.lines.output) }} event(s) to prepare.
      title: Calendar briefing
    - id: result
      needs: [check]
      output:
        briefing: ${{ vars.briefing }}
        events: ${{ len(steps.lines.output) }}
      artifacts:
        - ${{ vars.briefing }}
