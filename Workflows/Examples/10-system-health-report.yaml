# ORIX OS Automation
# File: Workflows/Examples/10-system-health-report.yaml
# Description: Built-in automation: collects system, disk, process, power and network facts into a dated Markdown report.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Read-only observation: nothing is cleaned, quit or changed. The only write is the report file.
# - Values are what the system tools report at the moment of the run (a snapshot, not a trend).
# - "Free" is the space macOS reports as available for important usage on the startup volume (purgeable space
#   included), which is what Finder shows; it can differ from `df`.
# - The low-disk notification compares that free fraction with `minFreeFraction`. It needs the ORIX app (a command-line
#   run has no application bundle): there the warning step fails by itself and the run ends PARTIALLY_SUCCEEDED.
# - Sections are written as JSON blocks, exactly as the tools returned them. Process names are those of `ps`.
# - A dry run executes no read tool, so it has no disk figures: the steps after the collection are reported as skipped.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: system-health-report
  name: Local system health report
  description: >-
    Collects system information, disk usage, the busiest processes, power state and network state at the
    same time, writes them into a dated Markdown report and warns when the startup disk is nearly full.
  tags: [system, health, report]
spec:
  triggers:
    - type: manual
    - type: schedule
      cron: "0 12 * * *"
  parameters:
    - name: outputFolder
      type: path
      default: ~/ORIX Samples/system-health-report/Reports
      description: Folder that receives the report.
    - name: minFreeFraction
      type: number
      default: 0.1
      description: Warn when less than this fraction of the startup disk is free.
  permissions:
    filesystem:
      read: ["${{ params.outputFolder }}"]
      write: ["${{ params.outputFolder }}"]
    notifications: true
  budget:
    maxDurationSeconds: 180
    maxToolCalls: 15
  steps:
    - id: paths
      set:
        report: ${{ params.outputFolder }}/health-${{ env.DATE }}.md
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.outputFolder }}
    - id: collect
      name: Collect facts in parallel
      parallel:
        - name: machine
          steps:
            - id: info
              tool: system.info
        - name: disk
          steps:
            - id: disk
              tool: system.diskUsage
        - name: processes
          steps:
            - id: processes
              tool: system.processes
              with:
                limit: 10
                sortBy: cpu
        - name: power
          steps:
            - id: power
              tool: system.powerState
        - name: network
          steps:
            - id: network
              tool: system.networkState
    - id: startup
      name: Pick the startup volume
      needs: [collect]
      transform: ${{ first(filter(steps.collect.output.disk.disk.volumes, v => v.path == "/")) }}
    - id: freeFraction
      needs: [startup]
      when: ${{ steps.startup.output != null }}
      transform: ${{ steps.startup.output.availableBytes / steps.startup.output.totalBytes }}
    - id: write
      name: Write the report
      needs: [paths, prepare, freeFraction]
      tool: filesystem.write
      with:
        path: ${{ vars.report }}
        overwrite: true
        content: |
          # System health — ${{ env.DATETIME }}

          Free space on the startup disk: ${{ steps.freeFraction.output * 100 }} % (${{ steps.startup.output.availableBytes }} of ${{ steps.startup.output.totalBytes }} bytes)

          ## Machine
          ${{ toJSON(steps.collect.output.machine.info) }}

          ## Disk
          ${{ toJSON(steps.collect.output.disk.disk.volumes) }}

          ## Busiest processes
          ${{ toJSON(steps.collect.output.processes.processes.processes) }}

          ## Power
          ${{ toJSON(steps.collect.output.power.power) }}

          ## Network
          ${{ toJSON(steps.collect.output.network.network) }}
    - id: check
      needs: [write]
      verify:
        - fileContains: ${{ vars.report }}
          text: "## Network"
        - truthy: ${{ steps.freeFraction.output > 0 && steps.freeFraction.output <= 1 }}
        - truthy: ${{ steps.collect.output.machine.info.cores > 0 }}
    - id: result
      needs: [check]
      output:
        report: ${{ vars.report }}
        freeFraction: ${{ steps.freeFraction.output }}
        lowDisk: ${{ steps.freeFraction.output < params.minFreeFraction }}
        osVersion: ${{ steps.collect.output.machine.info.osVersion }}
      artifacts:
        - ${{ vars.report }}
    - id: lowDisk
      needs: [result]
      if: ${{ steps.freeFraction.output < params.minFreeFraction }}
      then: [warn]
    - id: warn
      notify: Less than ${{ params.minFreeFraction * 100 }} % of the startup disk is free.
      title: System health
      continueOnError: true
