# ORIX OS Automation
# File: Workflows/Examples/13-scheduled-window-screenshot.yaml
# Description: Built-in automation: captures the frontmost window of one chosen application into a dated PNG, with consent.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Needs the macOS Screen Recording permission for ORIX (System Settings › Privacy & Security). ORIX cannot grant it
#   to itself; without it the capture step ends BLOCKED_PERMISSION and no file is written.
# - Only the window of the application named by `bundleID` is captured (permission scope window:<bundleID>), never the
#   whole display. A window showing passwords or payment forms is still captured as displayed: choose the app with care.
#   Password managers are refused by the tool, and nothing is captured while a password field has keyboard focus.
# - When the app has no normal window on screen (not running, minimised, on another Space) the capture is skipped, the
#   run succeeds and says `captured: false`; nothing is launched or brought forward.
# - Screenshots stay in the local folder; no step sends them anywhere. Old captures are never pruned.
# - A locked or sleeping Mac yields no usable window capture.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: scheduled-window-screenshot
  name: Scheduled screenshot of a selected app window
  description: >-
    On weekdays, every hour, captures the frontmost window of one chosen application into a dated PNG,
    provided the user granted Screen Recording and accepted the window-scoped permission of this workflow.
  tags: [screen, screenshot, schedule, consent]
spec:
  triggers:
    - type: schedule
      cron: "0 9-17 * * MON-FRI"
      timezone: America/Toronto
    - type: manual
  parameters:
    - name: bundleID
      type: string
      default: com.apple.Safari
      description: Bundle identifier of the application whose window is captured.
    - name: outputFolder
      type: path
      default: ~/ORIX Samples/scheduled-window-screenshot/Captures
      description: Folder that receives the screenshots.
  permissions:
    filesystem:
      read: ["${{ params.outputFolder }}"]
      write: ["${{ params.outputFolder }}"]
    screen: ["window:${{ params.bundleID }}"]
  budget:
    maxDurationSeconds: 120
    maxToolCalls: 10
  steps:
    - id: paths
      set:
        capture: ${{ params.outputFolder }}/capture-${{ env.DATE }}-${{ env.TIMESTAMP }}.png
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.outputFolder }}
    - id: windows
      name: Is a window of the app on screen?
      tool: system.windows
      with:
        bundleID: ${{ params.bundleID }}
    - id: hasWindow
      needs: [windows, paths, prepare]
      if: ${{ len(steps.windows.output.windows) > 0 }}
      then: [capture, check]
    - id: capture
      name: Capture the window
      tool: screen.capture
      with:
        scope: window
        bundleID: ${{ params.bundleID }}
        path: ${{ vars.capture }}
      timeoutSeconds: 30
    - id: check
      needs: [capture]
      verify:
        - fileNonEmpty: ${{ vars.capture }}
        - truthy: ${{ steps.capture.output.pixelWidth > 0 && steps.capture.output.pixelHeight > 0 }}
    - id: result
      needs: [hasWindow]
      output:
        captured: ${{ steps.hasWindow.output.result }}
        file: ${{ vars.capture }}
        application: ${{ params.bundleID }}
        windows: ${{ len(steps.windows.output.windows) }}
