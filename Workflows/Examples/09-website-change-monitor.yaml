# ORIX OS Automation
# File: Workflows/Examples/09-website-change-monitor.yaml
# Description: Built-in automation: fetches one page from one approved host, compares it with the previous copy and alerts on a change.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Only the host named by the `host` parameter may be contacted: it is the declared network permission. A `url` on
#   another host is not covered by the accepted permission and waits for approval instead of being fetched.
# - HTTPS only; plain http is accepted for this Mac's loopback addresses (localhost, 127.0.0.1), which is how the
#   example is tested. Redirects to another host are followed by the tool only inside its own rules.
# - One plain GET per run, no login, no JavaScript: pages rendered client-side or behind authentication are not supported.
# - "Changed" is a byte comparison of the saved response body with the previous one: rotating ads, timestamps or tokens
#   count as changes. Bodies larger than 2 MB are truncated before the comparison.
# - Respect the site's terms and robots policy; the default interval is one hour on purpose.
# - The page body is untrusted content: it is stored and compared, never interpreted.
# - The GET is retried (retry.force) because repeating it has no side effect.
# - The alert is a notification: it needs the ORIX app (a command-line run has no application bundle). There the alert
#   step fails by itself, the run ends PARTIALLY_SUCCEEDED and the `changed` output still says what happened.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: website-change-monitor
  name: Website change monitoring
  description: >-
    Fetches one web page from an approved host every hour, keeps the last copy in a state folder, compares
    the new body with the previous one and posts a notification when it differs.
  tags: [web, monitor, http, schedule]
spec:
  triggers:
    - type: interval
      seconds: 3600
    - type: manual
  parameters:
    - name: host
      type: string
      default: example.com
      description: The only host this workflow may contact; it is the declared network permission.
    - name: url
      type: string
      default: https://${{ params.host }}/
      description: Page to watch, on that host.
    - name: stateFolder
      type: path
      default: ~/ORIX Samples/website-change-monitor/State
      description: Folder that keeps current.html and previous.html.
  permissions:
    filesystem:
      read: ["${{ params.stateFolder }}"]
      write: ["${{ params.stateFolder }}"]
    network: ["${{ params.host }}"]
    notifications: true
  budget:
    maxDurationSeconds: 180
    maxToolCalls: 20
  steps:
    - id: prepare
      tool: filesystem.mkdir
      with:
        path: ${{ params.stateFolder }}
    - id: fetch
      name: Fetch the page
      tool: http.request
      with:
        url: ${{ params.url }}
        method: GET
        timeoutSeconds: 30
        maxBytes: 2000000
      retry: {maxAttempts: 3, backoffSeconds: 5, backoffMultiplier: 2, force: true}
    - id: saveCurrent
      needs: [prepare, fetch]
      tool: filesystem.write
      with:
        path: ${{ params.stateFolder }}/current.html
        content: ${{ default(steps.fetch.output.body, "") }}
        overwrite: true
    - id: findPrevious
      name: Is there a previous copy?
      needs: [prepare]
      tool: filesystem.search
      with:
        path: ${{ params.stateFolder }}
        pattern: previous.html
        maxDepth: 1
    - id: compare
      name: Compare with the previous copy (when there is one)
      needs: [findPrevious, saveCurrent]
      foreach: ${{ steps.findPrevious.output.matches }}
      as: previous
      collect: diff
      steps:
        - id: diff
          tool: filesystem.compare
          with:
            source: ${{ previous.path }}
            destination: ${{ params.stateFolder }}/current.html
    - id: changed
      needs: [compare]
      transform: ${{ steps.compare.output.count > 0 && !first(steps.compare.output.results).identical }}
    - id: promote
      name: The new copy becomes the reference
      needs: [compare]
      tool: filesystem.copy
      with:
        source: ${{ params.stateFolder }}/current.html
        destination: ${{ params.stateFolder }}/previous.html
        overwrite: true
    - id: check
      needs: [saveCurrent, promote]
      verify:
        - equals: ["${{ steps.fetch.output.status }}", 200]
        - fileNonEmpty: ${{ params.stateFolder }}/current.html
        - fileNonEmpty: ${{ params.stateFolder }}/previous.html
    - id: result
      needs: [check, changed]
      output:
        url: ${{ params.url }}
        status: ${{ steps.fetch.output.status }}
        firstRun: ${{ steps.compare.output.count == 0 }}
        changed: ${{ steps.changed.output }}
        sha256: ${{ steps.saveCurrent.output.sha256 }}
    - id: onChange
      name: Did the page change?
      needs: [result]
      if: ${{ steps.changed.output }}
      then: [alert]
    - id: alert
      notify: ${{ params.url }} changed since the last check.
      title: Website change
      continueOnError: true
