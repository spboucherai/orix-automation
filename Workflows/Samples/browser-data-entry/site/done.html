<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ORIX test form — confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Confirmation</h1>
    <p id="result" hidden></p>
    <p class="note">This is a test page: nothing was stored or sent.</p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const result = document.getElementById("result");
    if (q.get("name") && q.get("email") && q.get("plan") && q.get("terms") === "yes") {
      result.textContent = "Registered " + q.get("name") + " <" + q.get("email") + "> on plan " + q.get("plan") + ".";
    } else {
      result.textContent = "Incomplete submission.";
      result.className = "error";
    }
    result.hidden = false;
  </script>
</body>
</html>
