<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ORIX test form — step 1 of 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sign-up test form</h1>
    <p class="note">Step 1 of 2 — a static test page. Nothing is sent anywhere: the values travel in the address of the next page.</p>
    <form action="details.html" method="get">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required autocomplete="off">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="off">
      <button id="next" type="submit">Next</button>
    </form>
  </main>
</body>
</html>
