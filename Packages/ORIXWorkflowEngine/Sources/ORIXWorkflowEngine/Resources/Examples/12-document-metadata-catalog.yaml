# ORIX OS Automation
# File: Workflows/Examples/12-document-metadata-catalog.yaml
# Description: Built-in automation: walks a folder and writes size, modification date and SHA-256 of every file to a CSV catalogue.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Filesystem metadata only (size, modification date, content type) plus a SHA-256 per file; document-internal metadata
#   (PDF author, EXIF, …) is not read here — see the "PDF to structured data and report" example for PDFs.
# - The folder is walked 16 levels deep; hidden files (dot files) are skipped and symbolic links are not followed
#   or catalogued.
# - Hashing large folders takes time; four files are processed at once. One listing returns at most 2 000 files and
#   the tool-call budget (two calls per file) is sized for that: a larger folder makes the verification fail rather
#   than produce a silently incomplete catalogue.
# - The catalogue is rewritten in full at every run (the previous file is first copied to the run's artifacts); no history is kept.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: document-metadata-catalog
  name: Document metadata extraction and cataloging
  description: >-
    Walks a folder, reads size, modification date and SHA-256 of every file and writes one catalogue row
    per file to a CSV, then checks that the catalogue has as many rows as files found.
  tags: [documents, metadata, catalog, csv]
spec:
  triggers:
    - type: manual
  parameters:
    - name: documentsFolder
      type: path
      default: ~/ORIX Samples/document-metadata-catalog/Documents
      description: Folder to catalogue (recursively).
    - name: catalogFile
      type: path
      default: ~/ORIX Samples/document-metadata-catalog/catalog.csv
      description: CSV file to write.
  permissions:
    filesystem:
      read: ["${{ params.documentsFolder }}", "${{ params.catalogFile }}"]
      write: ["${{ params.catalogFile }}"]
  budget:
    maxDurationSeconds: 1800
    maxToolCalls: 5000
  steps:
    - id: list
      tool: filesystem.list
      with:
        path: ${{ params.documentsFolder }}
        recursive: true
        maxDepth: 16
        limit: 2000
    - id: files
      needs: [list]
      transform: ${{ filter(steps.list.output.entries, e => e.type == "file") }}
    - id: describe
      name: Describe each file
      needs: [files]
      foreach: ${{ steps.files.output }}
      as: doc
      concurrency: 4
      collect: row
      steps:
        - id: meta
          tool: filesystem.metadata
          with:
            path: ${{ doc.path }}
        - id: hash
          tool: filesystem.checksum
          with:
            path: ${{ doc.path }}
        - id: row
          needs: [meta, hash]
          transform: ${{ [doc.name, lower(extname(doc.name)), steps.meta.output.size, steps.meta.output.modified, default(steps.meta.output.contentType, ""), steps.hash.output.digest] }}
    - id: catalog
      name: Write the catalogue
      needs: [describe]
      tool: documents.csvWrite
      with:
        path: ${{ params.catalogFile }}
        columns: [path, extension, bytes, modified, contentType, sha256]
        rows: ${{ steps.describe.output.results }}
        overwrite: true
    - id: readBack
      needs: [catalog]
      tool: documents.csvRead
      with:
        path: ${{ params.catalogFile }}
        header: "yes"
        limit: 1
    - id: check
      needs: [readBack]
      verify:
        - fileNonEmpty: ${{ params.catalogFile }}
        - truthy: ${{ !steps.list.output.truncated }}
        - equals: ["${{ steps.describe.output.count }}", "${{ len(steps.files.output) }}"]
        - equals: ["${{ steps.readBack.output.totalRows }}", "${{ len(steps.files.output) }}"]
    - id: result
      needs: [check]
      output:
        catalog: ${{ params.catalogFile }}
        files: ${{ len(steps.files.output) }}
        totalBytes: ${{ sum(steps.describe.output.results, r => r[2]) }}
      artifacts:
        - ${{ params.catalogFile }}
