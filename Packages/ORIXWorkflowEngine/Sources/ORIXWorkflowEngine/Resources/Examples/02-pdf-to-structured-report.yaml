# ORIX OS Automation
# File: Workflows/Examples/02-pdf-to-structured-report.yaml
# Description: Built-in automation: extracts metadata and text statistics from the PDFs of a folder into a CSV and a PDF report.
#
# Author: Simon-Pierre Boucher
# Contact: contact@spboucher.ai
#
# Limitations
# - Text extraction works on PDFs that carry a text layer; scanned PDFs yield no text (no OCR here) and are reported
#   with 0 text characters.
# - Only the first 200 000 bytes of each PDF's text are read; the character count in the report is the count of what was read.
# - The title is the PDF's own "Title" property; many PDFs have none and the column is then empty. A title containing
#   a | character breaks the Markdown table (not the CSV).
# - The report is a plain table; no model is involved, so nothing is "summarised".
# - At most 100 PDFs are found per run (the default bound of filesystem.search); encrypted PDFs fail their iteration.
apiVersion: orix.ai/v1
kind: Automation
metadata:
  id: pdf-to-structured-report
  name: PDF to structured data and report
  description: >-
    Reads every PDF of a folder, extracts page count, title and the size of its text layer, writes the
    result as a CSV catalogue and renders a PDF report from a Markdown table.
  tags: [pdf, documents, report]
spec:
  triggers:
    - type: manual
  parameters:
    - name: inputFolder
      type: path
      default: ~/ORIX Samples/pdf-to-structured-report/Input
      description: Folder containing the PDFs.
    - name: outputFolder
      type: path
      default: ~/ORIX Samples/pdf-to-structured-report/Output
      description: Folder that receives catalog.csv, report.md and report.pdf.
  permissions:
    filesystem:
      read: ["${{ params.inputFolder }}", "${{ params.outputFolder }}"]
      write: ["${{ params.outputFolder }}"]
  budget:
    maxDurationSeconds: 900
    maxToolCalls: 1000
  steps:
    - id: find
      name: Find the PDFs
      tool: filesystem.search
      with:
        path: ${{ params.inputFolder }}
        pattern: "*.pdf"
    - id: pdfs
      needs: [find]
      transform: ${{ filter(steps.find.output.matches, m => m.type == "file") }}
    - id: prepare
      name: Create the output folder
      tool: filesystem.mkdir
      with:
        path: ${{ params.outputFolder }}
    - id: extract
      name: Read each PDF
      needs: [pdfs]
      foreach: ${{ steps.pdfs.output }}
      as: pdf
      concurrency: 2
      collect: row
      steps:
        - id: info
          tool: documents.pdfInfo
          with:
            path: ${{ pdf.path }}
        - id: text
          tool: documents.pdfText
          with:
            path: ${{ pdf.path }}
            maxBytes: 200000
        - id: row
          needs: [info, text]
          transform: ${{ [basename(pdf.path), steps.info.output.pageCount, default(steps.info.output.title, ""), sum(steps.text.output.pages, p => len(p.text))] }}
    - id: catalog
      name: Write the CSV catalogue
      needs: [extract, prepare]
      tool: documents.csvWrite
      with:
        path: ${{ params.outputFolder }}/catalog.csv
        columns: [file, pages, title, textCharacters]
        rows: ${{ steps.extract.output.results }}
        overwrite: true
    - id: compose
      name: Compose the report
      needs: [extract]
      transform: |
        ${{ "# PDF report\n\n"
            + "Folder: " + params.inputFolder + "\n\n"
            + "Generated: " + env.DATETIME + "\n\n"
            + "Documents: " + steps.extract.output.count + " — pages in total: " + sum(steps.extract.output.results, r => r[1]) + "\n\n"
            + "| File | Pages | Title | Text characters |\n|---|---|---|---|\n"
            + join(map(steps.extract.output.results, r => "| " + join(r, " | ") + " |"), "\n") + "\n" }}
    - id: markdown
      name: Write the Markdown report
      needs: [compose, prepare]
      tool: filesystem.write
      with:
        path: ${{ params.outputFolder }}/report.md
        overwrite: true
        content: ${{ steps.compose.output }}
    - id: render
      name: Render the report as PDF
      needs: [compose, prepare]
      tool: documents.renderPDF
      with:
        content: ${{ steps.compose.output }}
        destination: ${{ params.outputFolder }}/report.pdf
        overwrite: true
    - id: check
      name: Verify the artifacts
      needs: [catalog, markdown, render]
      verify:
        - truthy: ${{ steps.extract.output.count > 0 }}
        - equals: ["${{ steps.catalog.output.rows }}", "${{ steps.extract.output.count }}"]
        - fileNonEmpty: ${{ params.outputFolder }}/catalog.csv
        - fileContains: ${{ params.outputFolder }}/report.md
          text: "| File | Pages |"
        - fileNonEmpty: ${{ params.outputFolder }}/report.pdf
        - truthy: ${{ steps.render.output.pages >= 1 }}
    - id: result
      needs: [check]
      output:
        documents: ${{ steps.extract.output.count }}
        pages: ${{ sum(steps.extract.output.results, r => r[1]) }}
        catalog: ${{ params.outputFolder }}/catalog.csv
        report: ${{ params.outputFolder }}/report.pdf
      artifacts:
        - ${{ params.outputFolder }}/catalog.csv
        - ${{ params.outputFolder }}/report.pdf
